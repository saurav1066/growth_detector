[DATABASE]
db_name = tiktok_analysis.db
db_path = data/

[INGESTION]
batch_size = 1000
log_level = INFO

[ANALYSIS]
hashtag_min_count = 10
trending_threshold = 0.1

[VIRAL_DETECTION]
min_usage_threshold = 10
growth_threshold = 2.0
anomaly_threshold = 3.0
detection_window_hours = 24
confidence_threshold = 0.7
max_daily_alerts = 50
